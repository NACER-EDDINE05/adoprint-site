<VirtualHost *:80>
    ServerName adoprint.local
    DocumentRoot "C:/xampp/htdocs/ADO PRINT SITE/public"
    <Directory "C:/xampp/htdocs/ADO PRINT SITE/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/adoprint-error.log"
    CustomLog "logs/adoprint-access.log" common
</VirtualHost>
